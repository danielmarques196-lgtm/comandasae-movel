<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ComandASAE Móvel — ASAE UO VI</title><meta name="theme-color" content="#2f5a1c"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icone-192.png"><link rel="apple-touch-icon" href="icone-192.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="robots" content="noindex,nofollow">
<style>:root{--marca:#2f5a1c;--borda:#d5dccd}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif;background:#f2f4ef;color:#1c2418}
header{position:sticky;top:0;z-index:10;background:var(--marca);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;display:flex;align-items:center;gap:10px}
header b{font-size:17px;flex:1}header span{font-size:12.5px;opacity:.9}header.ficha b{flex:0}header .zoom{margin-left:auto;display:flex;gap:4px}
header button{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.4);border-radius:8px;padding:6px 12px;font-size:16px}
.m{padding:14px;max-width:640px;margin:0 auto}h2{margin:6px 0}label{display:block;margin:12px 0;font-weight:600;font-size:14px}label input{display:block;width:100%;margin-top:4px;font-size:17px;padding:10px;border:1px solid var(--borda);border-radius:8px}
button{font:inherit;border:1px solid var(--borda);background:#fff;border-radius:10px;padding:10px 16px;font-size:15px}button.prim{background:var(--marca);color:#fff;border-color:var(--marca);font-weight:600}.grande{width:100%;font-size:18px;padding:14px}
.acoes{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}.nota{color:#5c6656;font-size:13px}.erro{color:#c62828;font-weight:600;padding:6px 10px}
.lista{margin:14px 0;display:grid;gap:8px}.item{background:#fff;border:1px solid var(--borda);border-radius:10px;padding:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}.item small{color:#5c6656}
.tag{font-size:12px;padding:3px 9px;border-radius:12px;background:#e8ebe4;color:#3c4636;white-space:nowrap}.tag.ok{background:#dcefd0;color:#2f5a1c}.tag.aviso{background:#fff0c2;color:#7a5a00}
.aviso-box{background:#fff4d6;border:1px solid #e0b04a;border-radius:10px;padding:10px;margin-top:10px;font-size:14px}.rodape{display:flex;gap:8px;flex-wrap:wrap}
#toast{display:none;position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#1c2418;color:#fff;padding:10px 16px;border-radius:10px;z-index:50;max-width:90vw;font-size:14px}
.barra-baixo{position:sticky;bottom:0;display:flex;gap:8px;padding:10px 10px calc(env(safe-area-inset-bottom) + 10px);background:rgba(255,255,255,.97);border-top:1px solid var(--borda);z-index:9}.barra-baixo button{flex:1;font-size:16px}
.fp-zona{overflow:auto;background:#e9ece6;padding:4px;-webkit-overflow-scrolling:touch}
.fp-pag{position:relative;width:100%;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.2);aspect-ratio:595.28/841.89;--k:1.5}.fp-pag>img{position:absolute;inset:0;width:100%;height:100%;user-select:none;pointer-events:none}
.fp-in{position:absolute;box-sizing:border-box;border:0;margin:0;padding:0 calc(var(--k)*2px);background:rgba(255,236,120,.28);color:#0a2173;font:calc(var(--k)*8.4px)/1 Helvetica,Arial,sans-serif;border-radius:1px;min-width:0}
.fp-in.fp-c{text-align:center}.fp-in:focus{outline:2px solid #2f7de1;background:rgba(255,255,255,.95);z-index:2}.fp-in:not(:placeholder-shown){background:rgba(255,255,255,.9)}.fp-in::placeholder{color:#9aa3b5;font-size:.85em}.fp-in:disabled{background:transparent}
.fp-chk,.fp-circ{position:absolute;box-sizing:border-box;border:0;padding:0;margin:0;background:rgba(255,236,120,.28);cursor:pointer;min-width:0;min-height:0;border-radius:1px}
.fp-chk.on{background:linear-gradient(to top right,transparent calc(50% - 1px),#0a2173 50%,transparent calc(50% + 1px)),linear-gradient(to bottom right,transparent calc(50% - 1px),#0a2173 50%,transparent calc(50% + 1px))}
.fp-circ{background:transparent;border-radius:50%}.fp-circ.on{border:calc(var(--k)*1px) solid #0a2173}.fp-chk:disabled:not(.on){background:transparent}
.fp-err{outline:2px solid #d32f2f!important;background:rgba(255,120,120,.25)!important}
.passos{padding-left:20px;line-height:1.5}.passos li{margin:6px 0}
.pin{text-align:center}.pontos{display:flex;gap:16px;justify-content:center;margin:18px 0}.pontos i{width:16px;height:16px;border-radius:50%;border:2px solid var(--marca);display:block}.pontos i.on{background:var(--marca)}
.teclado{display:grid;grid-template-columns:repeat(3,76px);gap:14px;justify-content:center;margin-top:10px}.teclado button{height:76px;border-radius:50%;font-size:26px;padding:0}
.ligacao{border:0;background:none;color:var(--marca);text-decoration:underline;margin-top:16px}hr{border:0;border-top:1px solid var(--borda);margin:18px 0}
.rodar{display:none;background:#fff4d6;color:#7a5a00;text-align:center;padding:6px;font-size:14px;font-weight:600}
.barra-baixo button.seg{flex:2;background:#eef6e4;border-color:#9bb37a;font-weight:600}.barra-baixo button.seg.ok{background:#dcefd0}
.fp-alvo{outline:3px solid #f59e0b!important;outline-offset:1px;background:rgba(255,200,60,.35)!important;animation:alvo 1.2s ease-in-out 2}
@keyframes alvo{50%{outline-color:#fde68a}}
@media (orientation:landscape) and (max-height:500px){ header{padding-top:calc(env(safe-area-inset-top) + 4px);padding-bottom:4px}header button{padding:3px 10px}.barra-baixo{padding:5px 8px calc(env(safe-area-inset-bottom) + 5px)}.barra-baixo button{padding:7px 8px;font-size:14px}#fo-nif-info{display:none} }
/* orientação escolhida: horizontal com o telemóvel na vertical → a ficha roda 90° e ocupa o ecrã */
body.sem-scroll{overflow:hidden}
.ficha-wrap.rodado{position:fixed;top:0;left:100vw;width:100vh;width:100dvh;height:100vw;transform:rotate(90deg);transform-origin:top left;display:flex;flex-direction:column;background:#f2f4ef;z-index:30;overflow:hidden}
.ficha-wrap.rodado header{position:static;padding:4px 10px}.ficha-wrap.rodado header button{padding:3px 10px}
.ficha-wrap.rodado .fp-zona{flex:1;overflow:auto}.ficha-wrap.rodado #fo-nif-info{display:none}
.ficha-wrap.rodado .barra-baixo{position:static;padding:5px 8px}.ficha-wrap.rodado .barra-baixo button{padding:7px 8px;font-size:14px}
header .zoom button{font-size:14px}
/* formulário passo a passo */
.w h2{margin:4px 0 10px}.w-campo{margin:12px 0}.w-campo label{display:block;font-weight:600;font-size:14px;margin-bottom:5px}
.w-campo input,.w-campo textarea{width:100%;font-size:18px;padding:12px;border:1px solid var(--borda);border-radius:10px;background:#fff;font-family:inherit}
.w-campo input:focus,.w-campo textarea:focus{outline:2px solid var(--marca);border-color:var(--marca)}
.w-chips{display:flex;flex-wrap:wrap;gap:8px}.w-chip{padding:12px 16px;border-radius:24px;font-size:16px;min-height:48px}.w-chip.on{background:var(--marca);color:#fff;border-color:var(--marca);font-weight:600}
.w-brig{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.w-brig input{text-align:center;padding:12px 4px}
.w-passos{display:flex;gap:5px;padding:8px 12px;overflow-x:auto;background:#fff;border-bottom:1px solid var(--borda)}
.w-passos button{min-width:34px;height:34px;padding:0;border-radius:50%;font-size:13px;flex:0 0 auto}.w-passos button.feito{background:#dcefd0;border-color:#9bb37a}.w-passos button.atual{background:var(--marca);color:#fff;border-color:var(--marca)}
.item[data-ir]{cursor:pointer}.barra-baixo button:disabled{opacity:.5}
.leitor{position:fixed;inset:0;background:#000;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff}
.leitor video{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}.leitor .mira{position:relative;width:64vw;height:64vw;max-width:320px;max-height:320px;border:3px solid #9ee37d;border-radius:14px;box-shadow:0 0 0 2000px rgba(0,0,0,.45)}
.leitor p{position:relative;margin:18px 0;font-weight:600}.leitor button{position:relative;background:#fff;color:#000}
.resumo-dia{background:#fff;border:1px solid var(--borda);border-radius:10px;padding:10px;margin:10px 0;font-size:14px}
.w-gps{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.w-fotos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}
.w-foto{position:relative;aspect-ratio:1;background:#e9ece6;border-radius:8px;overflow:hidden}.w-foto img{width:100%;height:100%;object-fit:cover}.w-foto button{position:absolute;top:4px;right:4px;padding:2px 8px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;border:0}
.w-addfoto{display:block;text-align:center;border:2px dashed #9bb37a;border-radius:10px;padding:16px;font-weight:600;color:var(--marca);cursor:pointer}
.hist{background:#fff;border:1px solid var(--borda);border-radius:10px;padding:10px;margin-bottom:10px}.hist-t{width:100%;border-collapse:collapse;margin-top:6px;font-size:13px}.hist-t td{border-top:1px solid #eef0ea;padding:4px;vertical-align:top}
.menu-g{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}.menu-g button{padding:14px 8px;font-size:15px;font-weight:600}.menu-g button:last-child{grid-column:1/-1}
.aviso-uo{background:#e8f1fb;border:1px solid #9cc0e8;border-radius:10px;padding:10px;margin:8px 0;font-weight:600;color:#123b66}
.hoje-box{background:#fff;border:2px solid #9bb37a;border-radius:10px;padding:6px 10px;margin:8px 0}.dia{display:flex;gap:12px;padding:10px;background:#fff;border:1px solid var(--borda);border-radius:10px;margin:8px 0}.hoje-box .dia{border:0;padding:4px 0;margin:0}
.dia.hoje{border:2px solid var(--marca)}.dia-d{min-width:62px;text-align:center;color:var(--marca)}h3.sec{margin:16px 0 4px;font-size:15px;display:flex;gap:8px;align-items:center}

/* painel do inspetor */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0}.kpi{display:flex;flex-direction:column;align-items:flex-start;text-align:left;padding:10px 12px;border-radius:10px;background:#fff;border:1px solid var(--borda);min-height:72px}
.kpi .v{font-size:26px;font-weight:700;color:#1c2418;line-height:1.1}.kpi .l{font-size:12.5px;color:#5c6656;margin-top:3px}.kpi.aviso{border-color:#e0b04a;background:#fffaf0}.kpi.aviso .v{color:#7a5a00}.kpi.mau{border-color:#e7a1a1;background:#fdf1f1}.kpi.mau .v{color:#c62828}
.kpis.k4{grid-template-columns:repeat(4,1fr)}.kpis.k4 .kpi{min-height:0;padding:8px}.kpis.k4 .v{font-size:21px}.kpis.k4 .l{font-size:11.5px}
.atencao{background:#fff;border:2px solid #e7a1a1;border-radius:10px;padding:4px 10px 10px;margin:10px 0}.at{display:block;width:100%;text-align:left;margin-top:6px;padding:9px 10px;font-size:14px;border-radius:8px}.at.mau{background:#fdecea;border-color:#e7a1a1;color:#8e1c1c;font-weight:600}.at.aviso{background:#fff4d6;border-color:#e0b04a;color:#5c4300}
.tag.mau{background:#fde0e0;color:#a32020}
.w-addf{display:grid;grid-template-columns:1fr 1fr;gap:8px}.w-addf .w-addfoto{padding:14px 6px;font-size:14.5px}

/* toques rápidos (ex.: o mesmo algarismo do PIN duas vezes) não fazem zoom; o zoom com dois dedos continua */
html,body,button,a,input,select,textarea,label{touch-action:manipulation}

/* ===== painel do inspetor: topo, cartão de hoje e barra de navegação em baixo ===== */
header.topo-app{background:linear-gradient(135deg,#2f5a1c,#3f7a27);padding:calc(env(safe-area-inset-top) + 12px) 14px 14px}
.topo-app .ta-t{flex:1;display:flex;flex-direction:column;min-width:0}.topo-app .ta-t b{font-size:19px}.topo-app .ta-t span{font-size:12.5px;opacity:.85;margin-top:2px}
.topo-app button{width:40px;height:40px;padding:0;border-radius:50%;font-size:17px}
.m.com-nav{padding-bottom:calc(env(safe-area-inset-bottom) + 92px)}
h2.tit{font-size:20px;margin:4px 0 6px}
.nav-b{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(5,1fr);background:rgba(255,255,255,.98);border-top:1px solid var(--borda);padding:6px 4px calc(env(safe-area-inset-bottom) + 6px);box-shadow:0 -2px 12px rgba(0,0,0,.06)}
.nav-b button{position:relative;border:0;background:none;border-radius:12px;padding:4px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;color:#5c6656;font-size:11.5px}
.nav-b button .ic{font-size:21px;line-height:1.1;filter:grayscale(1);opacity:.75}.nav-b button.on{color:var(--marca);font-weight:700}.nav-b button.on .ic{filter:none;opacity:1}
.nav-b button.fofb .ic{width:46px;height:46px;margin-top:-20px;border-radius:50%;background:var(--marca);color:#fff;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;filter:none;opacity:1;box-shadow:0 3px 10px rgba(47,90,28,.45);border:3px solid #fff}
.nav-b .bolha{position:absolute;top:0;right:calc(50% - 22px);background:#c62828;color:#fff;font-style:normal;font-size:10.5px;font-weight:700;border-radius:9px;padding:1px 5px;min-width:16px}
.ct-hoje{background:linear-gradient(135deg,#ffffff,#eef6e4);border:1px solid #9bb37a;border-left:6px solid var(--marca);border-radius:14px;padding:12px 14px;margin:10px 0;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.ct-hoje .ct-l{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--marca);font-weight:700}.ct-hoje .ct-t{font-size:20px;font-weight:700;margin:3px 0}.ct-hoje .ct-s{font-size:14px;color:#3c4636;margin-top:2px}
.ct-hoje.vazio{border-left-color:#9aa394;background:#fff}.ct-hoje.vazio .ct-l{color:#5c6656}.ct-hoje.vazio .ct-t{font-size:17px}
.acoes-r{display:grid;grid-template-columns:1.2fr 1fr;gap:8px;margin:10px 0}.acoes-r button{padding:14px 8px;font-size:15px;font-weight:600;border-radius:12px}
.dia-num{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}.dia-num div{background:#fff;border:1px solid var(--borda);border-radius:12px;padding:8px 4px;text-align:center;display:flex;flex-direction:column}
.dia-num .v{font-size:22px;font-weight:700}.dia-num .l{font-size:11.5px;color:#5c6656}.dia-num .co .v{color:#b26a00}.dia-num .cr .v{color:#c62828}
.kpi,.item,.dia,.hist,.resumo-dia,.atencao{border-radius:12px}
h3.sec .ligacao{font-size:13px;font-weight:600;text-decoration:none;padding:0}
.ver-como{margin-top:6px;max-width:100%;font-size:14px;padding:5px 8px;border-radius:8px;border:1px solid rgba(255,255,255,.5);background:rgba(255,255,255,.15);color:#fff}
.ver-como option{color:#1c2418}
.ver-faixa{background:#fff3cd;color:#5c4400;border:1px solid #f0d77a;border-radius:12px;padding:10px;margin:8px 0;font-size:14px}.ver-faixa button{display:block;margin-top:6px;padding:6px 12px;font-size:14px}
.apagar-r{flex:0 0 auto;width:40px;height:40px;padding:0;border-radius:50%;font-size:17px;background:#fff;border:1px solid #e7a1a1}
.faixa-inst{display:flex;gap:8px;align-items:center;background:#fff4d6;border-bottom:1px solid #e0b04a;padding:8px 10px;font-size:13px;line-height:1.3}.faixa-inst span{flex:1}.faixa-inst button{border:1px solid #b88a1f;background:#fff;border-radius:8px;padding:6px 10px;font-size:13px}.faixa-inst .fi-x{border:0;background:none;font-size:16px}
</style></head><body><div id="app"></div><div id="toast"></div>

async function reduzirFoto(file,lado,qual){ lado=lado||1400; qual=qual||0.72; const url=URL.createObjectURL(file); try{ const img=await new Promise((ok,ko)=>{ const i=new Image(); i.onload=()=>ok(i); i.onerror=()=>ko(new Error("imagem inválida")); i.src=url; });
    const k=Math.min(1,lado/Math.max(img.naturalWidth,img.naturalHeight)), cv=document.createElement("canvas"); cv.width=Math.round(img.naturalWidth*k); cv.height=Math.round(img.naturalHeight*k); cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
    return await new Promise((ok,ko)=>cv.toBlob(b=>b?ok(b):ko(new Error("não foi possível converter a imagem")),"image/jpeg",qual)); } finally{ URL.revokeObjectURL(url); } }
function revisaoHTML(D,erros){ const v=k=>{ const x=D[k]; return Array.isArray(x)?x.join(", "):(k==="data"?fmtData(x):x)||""; };
  const linhas=[["Data / hora",fmtData(D.data)+" "+(D.hora||""),"data"],["NUF",[D.nufTipo,D.nuf].filter(Boolean).join("/"),"nuf"],["Brigada",(D.brigada||[]).filter(Boolean).join(" · "),"brigada"],["NIF",v("nif"),"nif"],["Operador",v("desig"),"desig"],
    ["Morada",[D.moradaEst,D.cpEst].filter(Boolean).join(", "),"moradaEst"],["Local",[D.freguesiaEst,D.concelhoEst,D.distritoEst].filter(Boolean).join(" · "),"concelhoEst"],["Tipo OE",v("tipoOE"),"tipoOE"],["Atividade",v("tipoActiv"),"tipoActiv"],
    ["Resultado",(D.resultado||[]).map(x=>x==="SI"?"Sem infração":x).join(" + "),"resultado"],["Fiscalização / localização",(D.modalidade||"Físico")+(D.gps?" · 📍 "+D.gps.lat+", "+D.gps.lon:""),"modalidade"],["Fotografias",String((D.fotos||[]).length),"fotos"]].concat((D.resultado||[]).some(x=>x!=="SI")?[["Infrações",v("infracoes"),"infracoes"]]:[]);
  const hx=D.nif&&(HIST&&HIST.r||[]).find(x=>x.n===D.nif);
  return `<h2>Revisão</h2>${hx?`<details class="aviso-box"><summary><b>Operador já fiscalizado</b> — ${hx.h.length} registo(s), último ${fmtData(hx.h[0][0])}</summary>${histHTML(hx)}</details>`:""}${erros.length?`<div class="aviso-box">Falta: ${erros.map(x=>esc(x[2])).join(", ")}</div>`:`<p class="nota">Campos obrigatórios completos. Pode concluir, ou completar outros campos na ficha (apreensões, identificação, amostras…).</p>`}
    <div class="lista">${linhas.map(([t,val,k])=>`<div class="item" data-ir="${k}"><div><small>${esc(t)}</small><br><b>${esc(val)||'<span class="erro">em falta</span>'}</b></div><span>✎</span></div>`).join("")}</div>`; }

  const er=validarFOF(D); if(er.length){ alert("Falta preencher: "+er.map(x=>x[2]).join(", ")+"."); E.modo="form"; E.passo=passoDe(er[0][0]); return inicio(); }

function abrirBlob(b){ const u=URL.createObjectURL(b); const w=window.open(u,"_blank"); if(!w){ const a=document.createElement("a"); a.href=u; a.download="FOF.pdf"; a.click(); } setTimeout(()=>URL.revokeObjectURL(u),120000); }
// envio automático para a caixa de receção da UO (cifrada com a chave pública da UO; o servidor não a consegue ler)
const b64=u=>{ let t=""; const b=new Uint8Array(u); for(let i=0;i<b.length;i+=0x8000) t+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000)); return btoa(t); };
const deB64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function cifrar(obj){ const pub=await crypto.subtle.importKey("raw",deB64(cfg.pub),{name:"ECDH",namedCurve:"P-256"},false,[]);
  const ef=await crypto.subtle.generateKey({name:"ECDH",namedCurve:"P-256"},true,["deriveBits"]);
  const bits=await crypto.subtle.deriveBits({name:"ECDH",public:pub},ef.privateKey,256); const hk=await crypto.subtle.importKey("raw",bits,"HKDF",false,["deriveKey"]);
  const epk=new Uint8Array(await crypto.subtle.exportKey("raw",ef.publicKey));
  const k=await crypto.subtle.deriveKey({name:"HKDF",hash:"SHA-256",salt:epk,info:new TextEncoder().encode("FOF-UOVI-v1")},hk,{name:"AES-GCM",length:256},false,["encrypt"]);
  const iv=crypto.getRandomValues(new Uint8Array(12)); const c=await crypto.subtle.encrypt({name:"AES-GCM",iv},k,new TextEncoder().encode(JSON.stringify(obj)));
  return {formato:"fof-cifrada",v:1,id:obj.id,kid:cfg.kid,epk:b64(epk),iv:b64(iv),c:b64(c),em:new Date().toISOString()}; }
const temCaixa=()=>!!(cfg&&(cfg.srv||cfg.gh)&&cfg.ce&&cfg.pub);
async function pacoteFOF(f,extra){ const o={formato:"comandasae-fof",versao:1,id:f.id,enviadaEm:new Date().toISOString(),dados:f.dados,fotos:[]};
  const falta=[]; for(const x of (f.dados.fotos||[])){ let b=null; try{ b=await fotoLer(f.id+":"+x.n); }catch(e){} if(b) o.fotos.push({nome:x.nome||("foto-"+x.n+".jpg"),b64:_b64(await b.arrayBuffer())}); else falta.push(x.n); }
  if(falta.length){ const e=new Error("Não foi possível ler "+(falta.length===1?"a fotografia n.º "+falta[0]:falta.length+" fotografias")+" desta FOF neste telemóvel. Abra a FOF, retire a(s) fotografia(s) em falta (ou volte a tirá-las) e conclua de novo."); e.fotos=true; throw e; }
  // revisão: impressão digital do conteúdo (igual em todas as tentativas de envio da mesma versão)
  { const hf=[]; for(const x of o.fotos) hf.push([...new Uint8Array(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(x.b64)))].map(b=>b.toString(16).padStart(2,"0")).join(""));   // impressão digital completa de cada fotografia
    const dg=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(JSON.stringify([f.dados,hf]))); o.rev=[...new Uint8Array(dg)].map(b=>b.toString(16).padStart(2,"0")).join("").slice(0,32); f.revEnv=o.rev; }
  // sem lista de fotografias (FOF refeita a partir da rejeição): a UO mantém as que já tem; lista vazia: o inspetor retirou-as todas
  // fotosJuntar: lista parcial (só as novas) — a UO junta-as às que já tem e nunca apaga as anteriores
  if(f.reenvio) o.reenvio=f.reenvio;   // reenvio pelo histórico: o conteúdo (e a revisão) é o mesmo; a UO não duplica
  o.fotosJuntar=!!f.dados.fotosJuntar; o.fotosManter=!Array.isArray(f.dados.fotos)||o.fotosJuntar;
  // autor: n.º de cartão desta ativação + código HMAC com a chave individual do inspetor (a UO confirma quem enviou)
  if(extra) Object.assign(o,extra);   // ex.: o PDF da partilha manual — entra antes do código do autor
  o.autor=String(cfg.cartao||""); if(cfg.ki){ const k=await crypto.subtle.importKey("raw",deB64(cfg.ki),{name:"HMAC",hash:"SHA-256"},false,["sign"]); o.mac=_b64(await crypto.subtle.sign("HMAC",k,new TextEncoder().encode(JSON.stringify(o)))); }
  return o; }
async function enviarServidor(f){ const o=await pacoteFOF(f);
  if(cfg.gh){ // caixa num repositório privado do GitHub (o ficheiro vai cifrado)
    const nome="caixa/"+new Date().toISOString().replace(/[:.]/g,"-")+"_"+f.id+".json", corpo=b64(new TextEncoder().encode(JSON.stringify(await cifrar(o))));
    const r=await fetch("https://api.github.com/repos/"+cfg.gh+"/contents/"+nome,{method:"PUT",headers:{"Authorization":"Bearer "+cfg.ce,"Accept":"application/vnd.github+json","Content-Type":"application/json"},body:JSON.stringify({message:"FOF "+f.id.slice(0,8),content:corpo})});
    if(!r.ok){ let m=""; try{ m=(await r.json()).message; }catch(e){} const e=new Error(m||("erro "+r.status)); e.servidor=r.status<500; e.estado=r.status;
      if(r.status===401||r.status===403||r.status===404){ if(!cfg.envioRecusado) notificar("Envio recusado","O servidor recusou o envio das FOF. Contacte a Chefia; pode enviar por e-mail.","recusa"); cfg.envioRecusado={em:new Date().toISOString(),estado:r.status}; gravarLS(CFG_K,cfg); } throw e; }
    if(cfg.envioRecusado){ delete cfg.envioRecusado; gravarLS(CFG_K,cfg); } return; }
  const r=await fetch(cfg.srv.replace(/\/+$/,"")+"/enviar",{method:"POST",headers:{"Content-Type":"application/json","X-Chave-Envio":cfg.ce},body:JSON.stringify(await cifrar(o))});
  if(!r.ok){ let m=""; try{ m=(await r.json()).erro; }catch(e){} const e=new Error(m||("erro "+r.status)); e.servidor=true; e.estado=r.status; throw e; } }
let aEnviar=false;
// envia uma cópia fixa da FOF; no fim só a marca como enviada se ninguém a alterou entretanto (senão fica na fila com a correção)
async function enviarRevisao(f){ const rev=f.em, snap=JSON.parse(JSON.stringify(f)); await enviarServidor(snap);
  const cur=(CACHE||[]).find(x=>x.id===f.id); if(!cur||cur.em!==rev||JSON.stringify(cur.dados)!==JSON.stringify(snap.dados)) return false;
  cur.enviada=true; cur.enviadaEm=new Date().toISOString(); delete cur.avisoFotos; delete cur.recebida; delete cur.validada; delete cur.manual; guardarFicha(Object.assign(cur,{recebida:undefined,validada:undefined,manual:undefined,revEnv:snap.revEnv||"-"})); return true; }   /* só volta a "Recebida" com a confirmação desta revisão */
async function enviarPendentes(silencio){ if(aEnviar||!temCaixa()||!navigator.onLine) return 0; aEnviar=true; let n=0;
  try{ for(const f of fichas().filter(x=>x.dados.estado==="concluida"&&!x.enviada)){ try{ if(await enviarRevisao(f)) n++; }
      catch(e){ if(e.fotos){ if(!silencio||!f.avisoFotos){ f.avisoFotos=true; alert((foOperador(f.dados)||"FOF")+": "+e.message); } continue; }   // problema só desta FOF: as outras seguem
        if(e.servidor&&e.estado===413){ if(!silencio) alert("FOF demasiado grande para o servidor ("+(foOperador(f.dados)||"")+"): retire fotografias."); continue; }
        if(e.servidor&&!silencio) alert("O servidor recusou a FOF: "+e.message+"\nPode enviar as FOF do dia por e-mail (botão na lista)."); break; } } }
  finally{ aEnviar=false; } if(n){ toast(n+" FOF enviada(s) para a ComandASAE."); if(!UI.fof&&desbloqueado) ecraLista(); } return n; }

async function enviar(){ const E=UI.fof, D=E.dados;
  if(temCaixa()){ if(!navigator.onLine){ toast("Sem rede: a FOF fica na fila e é enviada sozinha quando houver ligação.",4000); UI.fof=null; return inicio(); }

    aEnviar=true; try{ const f=fichas().find(x=>x.id===E.id)||{id:E.id,dados:D}; const ok=await enviarRevisao(f); aEnviar=false; if(ok){ E.enviada=true; toast("FOF enviada para a ComandASAE."); } else enviarPendentes(true); UI.fof=null; return inicio(); }
    catch(e){ aEnviar=false; if(e.fotos){ alert(e.message); UI.fof=null; return inicio(); } if(e.servidor) alert("O servidor recusou a FOF: "+e.message+"\nFica na fila; contacte a Chefia. Entretanto pode enviar as FOF do dia por e-mail (botão na lista)."); else toast("Sem ligação ao servidor: a FOF fica na fila e é enviada sozinha.",4000); UI.fof=null; return inicio(); } }
